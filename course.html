<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#030014">
  <title>Study Course · PTCE 2026</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=76">
  <link rel="stylesheet" href="css/notes.css?v=76">
</head>
<body class="course">
  <header class="app-header">
    <a href="index.html" class="logo hx-logo" aria-label="PTCE 2026 home" title="PTCE 2026 · Red Pill or Blue Pill?">
      <svg class="matrix-pill-icon" viewBox="0 0 38 32" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="bluePillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8"/>
            <stop offset="50%" stop-color="#0284c7"/>
            <stop offset="100%" stop-color="#075985"/>
          </linearGradient>
          <linearGradient id="redPillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff4b72"/>
            <stop offset="50%" stop-color="#e11d48"/>
            <stop offset="100%" stop-color="#881337"/>
          </linearGradient>
          <linearGradient id="pillGloss" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
          </linearGradient>
        </defs>
        <g transform="translate(11, 16) rotate(-22)">
          <rect x="-5" y="-11" width="10" height="22" rx="5" fill="url(#bluePillGrad)" stroke="#38bdf8" stroke-width="0.8"/>
          <line x1="-5" y1="0" x2="5" y2="0" stroke="rgba(255,255,255,0.4)" stroke-width="0.75"/>
          <rect x="-3" y="-9" width="2.5" height="18" rx="1.25" fill="url(#pillGloss)"/>
        </g>
        <g transform="translate(27, 16) rotate(22)">
          <rect x="-5" y="-11" width="10" height="22" rx="5" fill="url(#redPillGrad)" stroke="#ff4b72" stroke-width="0.8"/>
          <line x1="-5" y1="0" x2="5" y2="0" stroke="rgba(255,255,255,0.4)" stroke-width="0.75"/>
          <rect x="-3" y="-9" width="2.5" height="18" rx="1.25" fill="url(#pillGloss)"/>
        </g>
      </svg>
      <span class="hx-logo-text">PTCE<span>2026</span></span>
    </a>
    <h1 class="page-title course-header-title hdr-title">
      <svg class="header-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
      </svg>
      Study Course
    </h1>
    <a href="index.html" class="back-link">‹ Home</a>
  </header>

  <main class="container">
    <div id="courseListWrap">
      <div id="courseList" class="nx-notes-area"><p class="muted">Loading course…</p></div>
    </div>

    <div id="lessonView" class="card-block" style="display:none;"></div>

    <div id="loadError" class="card-block" style="display:none;">
      <h3>Failed to load course</h3>
      <p>Ensure you are serving the folder over localhost (e.g., <code>python -m http.server</code>) so fetch of <code>data/course.json</code> is allowed.</p>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/course.js?v=76"></script>
</body>
</html>
