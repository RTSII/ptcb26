<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#030014">
  <title>Flashcards · PTCE 2026</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="flashcards">
  <header class="app-header">
    <a href="index.html" class="logo">💊 PTCE <span>2026</span></a>
    <h1 class="page-title">🗂️ Flashcards</h1>
    <a href="index.html" class="back-link">‹ Home</a>
  </header>

  <main class="container">
    <div class="filter-row" id="filterRow"></div>

    <div id="cardArea">
      <div class="flashcard-wrap">
        <button type="button" class="card-nav card-nav-prev" id="prevBtn" aria-label="Previous card">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M14.5 5.25 8 12l6.5 6.75" fill="none" stroke="currentColor" stroke-width="2.35" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="flashcard" id="flashcard">
          <div class="face front">
            <div class="q-text" id="frontText">Loading...</div>
          </div>
          <div class="face back">
            <div class="a-text" id="backText"></div>
          </div>
        </div>
        <button type="button" class="card-nav card-nav-next" id="nextBtn" aria-label="Next card">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M9.5 5.25 16 12l-6.5 6.75" fill="none" stroke="currentColor" stroke-width="2.35" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <p class="card-counter" id="counter"></p>
      </div>
      <div class="btn-row card-actions">
        <button type="button" class="btn gold" id="flipBtn">Flip</button>
        <button type="button" class="btn grade-yes" id="knewBtn">✓ Knew it</button>
        <button type="button" class="btn grade-no" id="didntKnowBtn">✗ Didn't know</button>
        <button type="button" class="btn outline" id="bookmarkCardBtn">☆ Bookmark</button>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/flashcards.js"></script>
</body>
</html>
