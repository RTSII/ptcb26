<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#030014">
  <title>Flashcards · PTCE 2026</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="flashcards">
  <header class="app-header">
    <a href="index.html" class="logo" aria-label="PTCE 2026 home" title="PTCE 2026 · Red Pill or Blue Pill?">
      <svg class="matrix-pill-icon" viewBox="0 0 38 32" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="bluePillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8"/>
            <stop offset="50%" stop-color="#0284c7"/>
            <stop offset="100%" stop-color="#075985"/>
          </linearGradient>
          <linearGradient id="redPillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff4b72"/>
            <stop offset="50%" stop-color="#e11d48"/>
            <stop offset="100%" stop-color="#881337"/>
          </linearGradient>
          <linearGradient id="pillGloss" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
          </linearGradient>
        </defs>
        <g transform="translate(11, 16) rotate(-22)">
          <rect x="-5" y="-11" width="10" height="22" rx="5" fill="url(#bluePillGrad)" stroke="#38bdf8" stroke-width="0.8"/>
          <line x1="-5" y1="0" x2="5" y2="0" stroke="rgba(255,255,255,0.4)" stroke-width="0.75"/>
          <rect x="-3" y="-9" width="2.5" height="18" rx="1.25" fill="url(#pillGloss)"/>
        </g>
        <g transform="translate(27, 16) rotate(22)">
          <rect x="-5" y="-11" width="10" height="22" rx="5" fill="url(#redPillGrad)" stroke="#ff4b72" stroke-width="0.8"/>
          <line x1="-5" y1="0" x2="5" y2="0" stroke="rgba(255,255,255,0.4)" stroke-width="0.75"/>
          <rect x="-3" y="-9" width="2.5" height="18" rx="1.25" fill="url(#pillGloss)"/>
        </g>
      </svg>
      PTCE <span>2026</span>
    </a>
    <h1 class="page-title">🗂️ Flashcards</h1>
    <a href="index.html" class="back-link">‹ Home</a>
  </header>

  <main class="container">
    <div class="filter-row" id="filterRow"></div>

    <div id="cardArea">
      <div class="flashcard-wrap">
        <button type="button" class="card-nav card-nav-prev" id="prevBtn" aria-label="Previous card">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M14.5 5.25 8 12l6.5 6.75" fill="none" stroke="currentColor" stroke-width="2.35" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="flashcard" id="flashcard">
          <div class="face front">
            <div class="q-text" id="frontText">Loading...</div>
          </div>
          <div class="face back">
            <div class="a-text" id="backText"></div>
          </div>
        </div>
        <button type="button" class="card-nav card-nav-next" id="nextBtn" aria-label="Next card">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M9.5 5.25 16 12l-6.5 6.75" fill="none" stroke="currentColor" stroke-width="2.35" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <p class="card-counter" id="counter"></p>
      </div>
      <div class="btn-row card-actions">
        <button type="button" class="btn gold" id="flipBtn">Flip</button>
        <button type="button" class="btn grade-yes" id="knewBtn">✓ Knew it</button>
        <button type="button" class="btn grade-no" id="didntKnowBtn">✗ Didn't know</button>
        <button type="button" class="btn outline" id="bookmarkCardBtn">☆ Bookmark</button>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/flashcards.js"></script>
</body>
</html>
