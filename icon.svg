<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#041f10"/>
      <stop offset="60%" stop-color="#020d06"/>
      <stop offset="100%" stop-color="#010603"/>
    </radialGradient>

    <!-- Blue Pill 3D Gradient -->
    <linearGradient id="iconBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#0284c7"/>
      <stop offset="70%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <!-- Red Pill 3D Gradient -->
    <linearGradient id="iconRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b72"/>
      <stop offset="35%" stop-color="#e11d48"/>
      <stop offset="70%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <!-- Specular Gloss Highlight -->
    <linearGradient id="iconGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="glowBlue" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#00e5ff" flood-opacity="0.6"/>
    </filter>
    <filter id="glowRed" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#ff2a6d" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- App Icon Rounded Backdrop -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" stroke="rgba(0, 255, 65, 0.35)" stroke-width="4"/>

  <!-- Subtle Cybernetic Grid Overlay -->
  <g stroke="rgba(0, 255, 65, 0.08)" stroke-width="1.5">
    <line x1="64" y1="0" x2="64" y2="512"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="192" y1="0" x2="192" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="320" y1="0" x2="320" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
    <line x1="448" y1="0" x2="448" y2="512"/>
    <line x1="0" y1="64" x2="512" y2="64"/>
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="192" x2="512" y2="192"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="320" x2="512" y2="320"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="0" y1="448" x2="512" y2="448"/>
  </g>

  <!-- Blue Pill (Left - The Choice: Illusion, angled -22deg) -->
  <g transform="translate(160, 218) rotate(-22)" filter="url(#glowBlue)">
    <rect x="-42" y="-105" width="84" height="210" rx="42" fill="url(#iconBlueGrad)" stroke="#38bdf8" stroke-width="3"/>
    <line x1="-42" y1="0" x2="42" y2="0" stroke="rgba(255, 255, 255, 0.45)" stroke-width="2.5"/>
    <rect x="-26" y="-88" width="20" height="176" rx="10" fill="url(#iconGloss)"/>
  </g>

  <!-- Red Pill (Right - The Choice: Truth, angled 22deg) -->
  <g transform="translate(352, 218) rotate(22)" filter="url(#glowRed)">
    <rect x="-42" y="-105" width="84" height="210" rx="42" fill="url(#iconRedGrad)" stroke="#ff4b72" stroke-width="3"/>
    <line x1="-42" y1="0" x2="42" y2="0" stroke="rgba(255, 255, 255, 0.45)" stroke-width="2.5"/>
    <rect x="-26" y="-88" width="20" height="176" rx="10" fill="url(#iconGloss)"/>
  </g>

  <!-- App Title Typography -->
  <text x="256" y="420" font-family="'Chakra Petch', 'Arial Black', sans-serif" font-size="52" font-weight="700" letter-spacing="6" fill="#ffffff" text-anchor="middle">
    PTCE <tspan fill="#00ff41">2026</tspan>
  </text>
  <text x="256" y="456" font-family="'JetBrains Mono', monospace" font-size="16" letter-spacing="4" fill="#9cc9a9" text-anchor="middle">
    RED PILL // BLUE PILL
  </text>
</svg>
