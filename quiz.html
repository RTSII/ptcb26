<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#030014">
  <title>Quiz • PTCE 2026</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="quiz">
  <header class="app-header">
    <a href="index.html" class="logo">💊 PTCE <span>2026</span></a>
    <h1 class="header-title"><span class="header-glyph" aria-hidden="true">📝</span> Quiz</h1>
    <div class="header-actions">
      <button type="button" id="headerExitBtn" class="exit-btn" hidden>Exit</button>
      <a href="index.html" class="header-home">Home</a>
    </div>
  </header>

  <main class="container">
    <section id="setup" class="card-block">
      <div class="setup-primary">
        <div class="field" id="modeField">
          <label for="mode">Mode</label>
          <select id="mode">
            <option value="quick10">Quick 10</option>
            <option value="chapter">Chapter Test</option>
            <option value="missed">Missed ?s</option>
            <option value="bookmarked">Bookmarked</option>
            <option value="weak">Weakest Domain</option>
            <option value="weaksub">Weakest Subtopic</option>
          </select>
        </div>
        <div class="field" id="countRow" hidden>
          <label for="count">Questions</label>
          <select id="count"></select>
        </div>
      </div>
      <div class="setup-extras" id="setupExtras" hidden>
        <div class="field" id="domainRow" hidden>
          <label for="domain">Chapter</label>
          <select id="domain">
            <option value="All">All</option>
            <option value="Medications">Medications</option>
            <option value="Patient Safety and Quality Assurance">Patient Safety &amp; Q.A.</option>
            <option value="Order Entry and Processing">Order Entry &amp; Processing</option>
            <option value="Federal Requirements">Federal Requirements</option>
          </select>
        </div>
        <div class="field" id="subtopicRow" hidden>
          <label for="subtopic">Subtopic</label>
          <select id="subtopic">
            <option value="">All</option>
          </select>
        </div>
        <div class="field" id="diffRow" hidden>
          <label for="difficulty">Difficulty</label>
          <select id="difficulty">
            <option value="">All</option>
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
          </select>
        </div>
      </div>
      <div class="setup-actions">
        <a class="button ghost setup-back" href="index.html">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M14.5 6.5 9 12l5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Back</span>
        </a>
        <button type="button" id="startBtn" class="cta setup-start">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M9.2 7.2v9.6L17.4 12 9.2 7.2z" fill="currentColor"/>
          </svg>
          <span>Start</span>
        </button>
        <div class="setup-end">
          <button type="button" id="clearMissedBtn" class="button clear-btn" hidden aria-label="Clear missed" title="Clear missed">
            <svg class="clear-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M9 4.75h6M5.75 7.25h12.5M8.25 7.25l.55 11.1a1 1 0 0 0 1 .9h4.4a1 1 0 0 0 1-.9l.55-11.1M10.25 11v5.25M13.75 11v5.25" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="clear-count" hidden></span>
          </button>
          <button type="button" id="clearBookmarksBtn" class="button clear-btn" hidden aria-label="Clear bookmarks" title="Clear bookmarks">
            <svg class="clear-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M9 4.75h6M5.75 7.25h12.5M8.25 7.25l.55 11.1a1 1 0 0 0 1 .9h4.4a1 1 0 0 0 1-.9l.55-11.1M10.25 11v5.25M13.75 11v5.25" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="clear-count" hidden></span>
          </button>
        </div>
      </div>
    </section>

    <section id="quiz" class="card-block" style="display:none;">
      <div class="quiz-header">
        <div id="qnum" class="chip">Question 1/10</div>
        <div id="qdomain" class="chip">Domain</div>
        <button type="button" id="exitQuizBtn" class="exit-btn">Exit</button>
      </div>
      <div class="progress"><div id="progBar" class="progress-bar" style="width:0%"></div></div>
      <div class="q-toolbar">
        <div id="qtext" class="qtext"></div>
        <button id="bookmarkBtn" class="bookmark-btn" aria-pressed="false" title="Bookmark question">☆ Bookmark</button>
      </div>
      <div id="choices" class="choices"></div>
      <div class="actions">
        <button id="prevBtn" class="button ghost">Previous</button>
        <button id="nextBtn" class="cta">Next</button>
      </div>
    </section>

    <section id="results" class="card-block" style="display:none;">
      <h2>Results</h2>
      <p><strong id="scoreLine"></strong></p>
      <div class="progress"><div id="scoreBar" class="progress-bar" style="width:0%"></div></div>
      <div id="review"></div>
      <div class="row" style="margin-top:16px;">
        <button id="retryBtn" class="cta">Retry</button>
        <a class="button" href="dashboard.html">View Dashboard</a>
        <a class="button ghost" href="index.html">Home</a>
      </div>
    </section>

    <section id="loadError" class="card-block" style="display:none;">
      <h2>Failed to load questions</h2>
      <p>Ensure you are serving the folder over localhost (e.g., <code>python -m http.server</code>) so fetch of <code>data/questions.json</code> is allowed.</p>
    </section>
  </main>

  <dialog id="exitDialog" class="exit-dialog" aria-labelledby="exitDialogText">
    <p id="exitDialogText"></p>
    <div class="exit-dialog-actions">
      <button type="button" id="exitCancelBtn" class="button ghost">Keep going</button>
      <button type="button" id="exitConfirmBtn" class="exit-btn">Exit</button>
    </div>
  </dialog>

  <script src="js/app.js"></script>
  <script src="js/quiz.js"></script>
</body>
</html>
